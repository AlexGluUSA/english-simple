<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Simple</title><style>body{font-family:system-ui;max-width:700px;margin:40px auto;padding:20px;background:#f4f7fc;color:#182744}main{background:white;padding:24px;border-radius:18px}select,button{padding:12px;margin:6px 0;border:1px solid #ccd5e6;border-radius:9px;font:inherit}h1{color:#2451bd}</style><main><h1>English Simple</h1><p>Учимся строить вопросы в Future Simple</p><label>Местоимение <select id="p"><option>I</option><option>You</option><option>He</option><option>She</option><option>We</option><option>They</option><option>It</option></select></label><p><label>Транскрипция <select id="mode"><option value="cy">Кириллица</option><option value="ipa">Международная IPA</option><option value="both">Кириллица + IPA</option><option value="none">Без транскрипции</option></select></label></p><h2 id="en"></h2><p id="cy"></p><p id="ipa"></p><p id="ru"></p><button id="speak">🔊 Слушать</button><button id="next">Следующее предложение →</button><p id="count"></p></main><script>const P=['I','You','He','She','We','They','It'];const verbs=['work tomorrow','have time','get paid today','need help','see the result','understand this','find the answer','be late','finish today','go home early'];const ru=['работать завтра','иметь время','получить оплату сегодня','нуждаться в помощи','увидеть результат','понять это','найти ответ','опоздать','закончить сегодня','уйти домой рано'];const cy=['уёрк тумо́роу','хэв тайм','гет пэйд тудэ́й','нид хэлп','си зэ ризалт','андэрстэнд зис','файнд зи энсэр','би лэйт','финиш тудэй','гоу хоум ёрли'];const ipa=['wɝk təˈmɑroʊ','hæv taɪm','ɡɛt peɪd təˈdeɪ','nid hɛlp','si ðə rɪˈzʌlt','ˌʌndɚˈstænd ðɪs','faɪnd ði ˈænsɚ','bi leɪt','ˈfɪnɪʃ təˈdeɪ','ɡoʊ hoʊm ˈɝli'];const it=['Will it work?','Will it take long?','Will it cost more?','Will it rain tomorrow?','Will it be ready today?','Will it happen again?','Will it fit?','Will it help?','Will it start?','Will it be enough?'];const itru=['Это будет работать?','Это займёт много времени?','Это будет стоить дороже?','Завтра будет дождь?','Это будет готово сегодня?','Это повторится?','Это подойдёт по размеру?','Это поможет?','Это запустится?','Этого будет достаточно?'];let i=0;const $=x=>document.getElementById(x);$('mode').value=localStorage.getItem('trans')||'cy';function render(){let p=$('p').value,m=$('mode').value,s=p==='It'?it[i]:'Will '+p+' '+verbs[i]+'?';$('en').textContent=s;$('ru').textContent=p==='It'?itru[i]:'Будет ли '+p+' '+ru[i]+'?';$('cy').textContent=m==='cy'||m==='both'?'Кириллица: уил '+p.toLowerCase()+' '+cy[i]:'';$('ipa').textContent=m==='ipa'||m==='both'?'IPA: /wɪl '+p.toLowerCase()+' '+ipa[i]+'/':'';if(p==='It'){$('cy').textContent='';$('ipa').textContent=''}$('count').textContent=(i+1)+' / 10'}$('p').onchange=()=>{i=0;render()};$('mode').onchange=()=>{localStorage.setItem('trans',$('mode').value);render()};$('next').onclick=()=>{i=(i+1)%10;render()};$('speak').onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance($('en').textContent);u.lang='en-US';speechSynthesis.speak(u)};render()</script></html>
