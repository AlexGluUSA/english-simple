<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Simple</title><style>body{font-family:system-ui;max-width:700px;margin:40px auto;padding:20px;background:#f4f7fc;color:#182744}main{background:white;padding:24px;border-radius:18px}select,button{padding:12px;margin:6px 0;border:1px solid #ccd5e6;border-radius:9px;font:inherit}h1{color:#2451bd}</style><main><h1>English Simple</h1><p>Учимся строить вопросы в Future Simple</p><label>Местоимение <select id="p"><option>I</option><option>You</option><option>He</option><option>She</option><option>We</option><option>They</option><option>It</option></select></label><p><label>Транскрипция <select id="mode"><option value="cy">Кириллица</option><option value="ipa">Международная IPA</option><option value="both">Кириллица + IPA</option><option value="none">Без транскрипции</option></select></label></p><h2 id="en"></h2><p id="cy"></p><p id="ipa"></p><p id="ru"></p><label>Скорость <select id="speed"><option value="0.7">Медленно (0,7×)</option><option value="1" selected>Нормально (1×)</option><option value="1.2">Быстро (1,2×)</option></select></label><p><button id="speak">🔊 Слушать</button></p><button id="next">Следующее предложение →</button><p id="count"></p></main><script>const P=['I','You','He','She','We','They','It'];const verbs=['work tomorrow','have time','get paid today','need help','see the result','understand this','find the answer','be late','finish today','go home early'];const ru=['работать завтра','иметь время','получить оплату сегодня','нуждаться в помощи','увидеть результат','понять это','найти ответ','опоздать','закончить сегодня','уйти домой рано'];const cy=['уёрк тумо́роу','хэв тайм','гет пэйд тудэ́й','нид хэлп','си зэ ризалт','андэрстэнд зис','файнд зи энсэр','би лэйт','финиш тудэй','гоу хоум ёрли'];const ipa=['wɝk təˈmɑroʊ','hæv taɪm','ɡɛt peɪd təˈdeɪ','nid hɛlp','si ðə rɪˈzʌlt','ˌʌndɚˈstænd ðɪs','faɪnd ði ˈænsɚ','bi leɪt','ˈfɪnɪʃ təˈdeɪ','ɡoʊ hoʊm ˈɝli'];const it=['Will it work?','Will it take long?','Will it cost more?','Will it rain tomorrow?','Will it be ready today?','Will it happen again?','Will it fit?','Will it help?','Will it start?','Will it be enough?'];const ruSubjects=['я','ты','он','она','мы','они'];const cySubjects=['ай','ю','хи','ши','уи','зэй','ит'];const ipaSubjects=['aɪ','ju','hi','ʃi','wi','ðeɪ','ɪt'];const itCy=['уил ит уёрк','уил ит тэйк лонг','уил ит кост мор','уил ит рэйн тумороу','уил ит би рэди тудэй','уил ит хэпэн эгэн','уил ит фит','уил ит хэлп','уил ит старт','уил ит би инаф'];const itIpa=['wɪl ɪt wɝk','wɪl ɪt teɪk lɔŋ','wɪl ɪt kɔst mɔr','wɪl ɪt reɪn təˈmɑroʊ','wɪl ɪt bi ˈrɛdi təˈdeɪ','wɪl ɪt ˈhæpən əˈɡɛn','wɪl ɪt fɪt','wɪl ɪt hɛlp','wɪl ɪt stɑrt','wɪl ɪt bi ɪˈnʌf'];const itru=['Это будет работать?','Это займёт много времени?','Это будет стоить дороже?','Завтра будет дождь?','Это будет готово сегодня?','Это повторится?','Это подойдёт по размеру?','Это поможет?','Это запустится?','Этого будет достаточно?'];let i=0;const $=x=>document.getElementById(x);$('mode').value=localStorage.getItem('trans')||'cy';function render(){let p=$('p').value,m=$('mode').value,j=P.indexOf(p),s=p==='It'?it[i]:'Will '+p+' '+verbs[i]+'?';$('en').textContent=s;const translations=[['Я буду работать завтра?','У меня будет время?','Мне сегодня заплатят?','Мне понадобится помощь?','Я увижу результат?','Я пойму это?','Я найду ответ?','Я опоздаю?','Я закончу сегодня?','Я уйду домой рано?'],['Ты будешь работать завтра?','У тебя будет время?','Тебе сегодня заплатят?','Тебе понадобится помощь?','Ты увидишь результат?','Ты поймёшь это?','Ты найдёшь ответ?','Ты опоздаешь?','Ты закончишь сегодня?','Ты уйдёшь домой рано?'],['Он будет работать завтра?','У него будет время?','Ему сегодня заплатят?','Ему понадобится помощь?','Он увидит результат?','Он поймёт это?','Он найдёт ответ?','Он опоздает?','Он закончит сегодня?','Он уйдёт домой рано?'],['Она будет работать завтра?','У неё будет время?','Ей сегодня заплатят?','Ей понадобится помощь?','Она увидит результат?','Она поймёт это?','Она найдёт ответ?','Она опоздает?','Она закончит сегодня?','Она уйдёт домой рано?'],['Мы будем работать завтра?','У нас будет время?','Нам сегодня заплатят?','Нам понадобится помощь?','Мы увидим результат?','Мы поймём это?','Мы найдём ответ?','Мы опоздаем?','Мы закончим сегодня?','Мы уйдём домой рано?'],['Они будут работать завтра?','У них будет время?','Им сегодня заплатят?','Им понадобится помощь?','Они увидят результат?','Они поймут это?','Они найдут ответ?','Они опоздают?','Они закончат сегодня?','Они уйдут домой рано?']];$('ru').textContent=p==='It'?itru[i]:translations[j][i];$('cy').textContent=(m==='cy'||m==='both')?'Кириллица: '+(p==='It'?itCy[i]:'уил '+cySubjects[j]+' '+cy[i]):'';$('ipa').textContent=(m==='ipa'||m==='both')?'IPA: /'+(p==='It'?itIpa[i]:'wɪl '+ipaSubjects[j]+' '+ipa[i])+'/':'';$('count').textContent=(i+1)+' / 10'}
$('p').onchange=()=>{i=0;render()};$('mode').onchange=()=>{localStorage.setItem('trans',$('mode').value);render()};$('next').onclick=()=>{i=(i+1)%10;render()};$('speak').onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance($('en').textContent);u.lang='en-US';u.rate=Number($('speed').value);const v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase()==='en-us');if(v)u.voice=v;speechSynthesis.speak(u)};$('speed').value=localStorage.getItem('speed')||'1';$('speed').onchange=()=>localStorage.setItem('speed',$('speed').value);render()</script></html>
